name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build JupyterLite deployment
        run: bash ./build.sh -c

      - name: Package complete deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/datax-now.zip
          test -f dist/cors_server.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report public deployment URLs
        run: |
          page_url="${{ steps.deployment.outputs.page_url }}"
          page_url="${page_url%/}/"
          echo "JupyterLite: ${page_url}"
          echo "ZIP: ${page_url}datax-now.zip"
          {
            echo "## JupyterLite deployment"
            echo
            echo "- Site: ${page_url}"
            echo "- ZIP: ${page_url}datax-now.zip"
          } >> "$GITHUB_STEP_SUMMARY"
